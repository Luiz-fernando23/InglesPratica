services:
  - type: web
    name: ingles-na-mao
    runtime: docker
    dockerfilePath: backend/Dockerfile.prod
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ingles-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:3000
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:voce@exemplo.com

databases:
  - name: ingles-db
    plan: free
